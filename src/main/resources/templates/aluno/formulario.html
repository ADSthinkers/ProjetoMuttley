<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="container-fluid" style="max-width: 900px; margin: 0 auto;">
        <h2 class="text-center" th:text="(${aluno.id != null} ? 'Editar Aluno' : 'Novo Aluno')"></h2>

        <form th:action="@{/aluno/salvar}" th:object="${aluno}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input class="form-control" type="text" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                <div th:errors="*{nome}" class="invalid-feedback"></div>
            </div>

            <div class="form-group">
                <label for="ra">RA:</label>
                <input class="form-control" type="text" th:field="*{ra}" th:classappend="${#fields.hasErrors('ra')} ? 'is-invalid'">
                <div th:errors="*{ra}" class="invalid-feedback"></div>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input class="form-control" type="text" th:field="*{cpf}" th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
                <div th:errors="*{cpf}" class="invalid-feedback"></div>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input class="form-control" type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div th:errors="*{email}" class="invalid-feedback"></div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">
                <span th:text="${aluno.id != null} ? 'Atualizar' : 'Cadastrar'"></span>
            </button>
            <a th:href="@{/aluno}" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</body>
</html>
