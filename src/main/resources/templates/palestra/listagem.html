<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="container-fluid" style="max-width: 1000px; margin: 0 auto;">
    <h2 class="text-center">Lista de Palestras</h2>
    
    <div th:if="${message != null}"
        class="alert alert-success alert-dismissible fade show text-center" role="alert">
        [[${message}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error != null}"
        class="alert alert-danger text-center">
        [[${error}]]
    </div>

    <div class="mb-3">
        <a th:href="@{/palestra/formulario}" class="btn btn-primary">
            Nova Palestra
        </a>
    </div>

    <div class="table-responsive-xl">
        <table class="table table-hover align-middle">
            <thead class="thead-light">
                <tr>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Competências</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="palestra : ${listPalestra}">
                    
                    <td th:text="${palestra.titulo}"></td>

                    <td th:text="${palestra.descricao}"></td>

                    <td>
                        <span th:if="${palestra.competencias != null and !palestra.competencias.isEmpty()}">
                            <span th:each="comp : ${palestra.competencias}"
                                  class="badge bg-info text-dark me-1"
                                  th:text="${comp.nome}">
                            </span>
                        </span>
                        <span th:if="${palestra.competencias == null or palestra.competencias.isEmpty()}">
                            -
                        </span>
                    </td>

                    <td th:text="${palestra.inicio != null 
                        ? #temporals.format(palestra.inicio, 'dd/MM/yyyy HH:mm') 
                        : '-'}">
                    </td>

                    <td th:text="${palestra.fim != null 
                        ? #temporals.format(palestra.fim, 'dd/MM/yyyy HH:mm') 
                        : '-'}">
                    </td>

                    <td>
                        <a th:href="@{'/palestra/formulario/' + ${palestra.id}}"
                        class="btn btn-sm btn-warning">
                        Editar
                        </a>
                        
                        <form th:action="@{'/palestra/delete/' + ${palestra.id}}" 
                            method="post" style="display:inline;">
                            <button class="btn btn-sm btn-danger"
                                    onclick="return confirm('Tem certeza que deseja excluir esta palestra?')">
                                Excluir
                            </button>
                        </form>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${listPalestra == null or listPalestra.isEmpty()}">
        <p class="text-center">Nenhuma palestra encontrada.</p>
    </div>
</div>

</body>
</html>
