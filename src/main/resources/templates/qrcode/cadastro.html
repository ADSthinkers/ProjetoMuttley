<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Participante</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 460px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        h2 { color: #1a1a1a; text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4a4a4a; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #28a745; box-shadow: 0 0 0 3px rgba(40,167,69,0.1); }
        .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; background-color: #28a745; color: white; margin-top: 1rem; transition: 0.2s; }
        .btn:hover { background-color: #1e7e34; }
        .palestra-info { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 1.5rem; font-size: 0.9rem; color: #555; }
        .palestra-info strong { color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Primeiro Acesso</h2>
        <p class="subtitle">Complete seu cadastro para registrar sua inscrição</p>

        <div class="palestra-info">
            Palestra: <strong th:text="${palestra.titulo}">Título</strong>
        </div>

        <form th:action="@{'/participar/' + ${token} + '/cadastro'}" method="post">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" name="cpf" th:value="${cpf}" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" th:value="${email}" placeholder="seu@email.com" required>
            </div>
            <button type="submit" class="btn">Cadastrar e Confirmar Inscrição</button>
        </form>
    </div>
</body>
</html>
