<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 420px; padding: 3rem 2.5rem; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 3.5rem; margin-bottom: 1rem; }
        h2 { color: #dc3545; font-size: 1.4rem; margin-bottom: 1rem; }
        p { color: #666; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>Link Inválido</h2>
        <p th:text="${erro}">Este QR Code não é válido ou a palestra não foi encontrada.</p>
    </div>
</body>
</html>
