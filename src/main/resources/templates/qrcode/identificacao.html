<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Participação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 460px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .evento-badge { background: #e8f4fd; color: #0288d1; font-size: 0.8rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 1rem; }
        h2 { color: #1a1a1a; text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; }
        .palestra-titulo { text-align: center; color: #555; margin-bottom: 2rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4a4a4a; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; background-color: #007bff; color: white; margin-top: 1rem; transition: 0.2s; }
        .btn:hover { background-color: #0056b3; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffc107; padding: 12px 16px; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
        .divider { text-align: center; color: #aaa; margin: 1.5rem 0 0.5rem; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <div style="text-align:center;">
            <span class="evento-badge">Registro de Presença</span>
        </div>
        <h2 th:text="${palestra.titulo}">Palestra</h2>
        <p class="palestra-titulo" th:text="${palestra.descricao}"></p>

        <div th:if="${aviso != null}" class="alert-warning" th:text="${aviso}"></div>

        <form th:action="@{'/participar/' + ${token}}" method="post">
            <div class="form-group">
                <label>CPF</label>
                <input type="text" name="cpf" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>
            <button type="submit" class="btn">Confirmar Presença</button>
        </form>

        <p class="divider">Primeira vez? Preencha e clique para se cadastrar automaticamente.</p>
    </div>
</body>
</html>
