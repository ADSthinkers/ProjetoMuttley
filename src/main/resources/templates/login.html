<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Muttley</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            color: #007bff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #999;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-danger {
            background-color: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6c6;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            color: #4a4a4a;
            font-weight: 600;
            font-size: 0.88rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: 0.2s;
        }

        .btn-login:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
        }

        .hint {
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <h1>Muttley</h1>
            <p>Sistema de Gestão de Eventos</p>
        </div>

        <div th:if="${param.erro}" class="alert alert-danger">
            Login ou senha incorretos. Tente novamente.
        </div>

        <div th:if="${param.saiu}" class="alert alert-success">
            Você saiu com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Login / E-mail</label>
                <input type="text" id="username" name="username"
                       placeholder="Admin: login | Palestrante: e-mail" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password"
                       placeholder="Sua senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="hint">
            Admin: use seu <strong>login</strong><br>
            Palestrante: use seu <strong>e-mail</strong>
        </p>
    </div>
</body>

</html>
