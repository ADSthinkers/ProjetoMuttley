<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="container-fluid" style="max-width: 900px; margin: 0 auto;">
    <h2 class="text-center">Lista de xp</h2>
    <div th:if="${message != null}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
        [[${message}]]
        <button type="button" class="close btn-sm" data-dismiss="alert">
            <span>&times;</span>
        </button>
    </div>
    <a th:href="@{/xp/formulario}" class="btn btn-primary mb-3">
        Novo xp
    </a>
    <div th:if="${xp.size() > 0}">
        <table class="table table-hover table-responsive-xl">
            
            <thead class="thead-light">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="xp : ${xp}">
                    <td th:text="${xp.horas}"></td>
                    <td>
                        <a th:href="@{/xp/formulario/{id}(id=${xp.id})}">
                            Editar
                        </a>
                        |
                        <a th:href="@{/xp/delete/{id}(id=${xp.id})}"
                           onclick="return confirm('Deseja realmente excluir?')">
                            Excluir
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
