<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
    <div class="container-fluid" style="max-width: 900px; margin: 0 auto;">
        <h2 class="text-center" th:text="${evento.id != null} ? 'Editar Evento' : 'Novo Evento'"></h2>

        <form th:action="@{/evento/salvar}" th:object="${evento}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="titulo">Título:</label>
                <input class="form-control" type="text" th:field="*{titulo}"
                       th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
                <div th:errors="*{titulo}" class="invalid-feedback"></div>
            </div>

            <div class="form-group">
                <label for="dataInicio">Data de Início:</label>
                <input class="form-control" type="date" th:field="*{dataInicio}"
                       th:classappend="${#fields.hasErrors('dataInicio')} ? 'is-invalid'">
                <div th:errors="*{dataInicio}" class="invalid-feedback"></div>
            </div>

            <div class="form-group">
                <label for="local">Local:</label>
                <input class="form-control" type="text" th:field="*{local}"
                       th:classappend="${#fields.hasErrors('local')} ? 'is-invalid'">
                <div th:errors="*{local}" class="invalid-feedback"></div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">
                <span th:text="${evento.id != null} ? 'Atualizar' : 'Cadastrar'"></span>
            </button>
            <a th:href="@{/evento}" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</body>
</html>
