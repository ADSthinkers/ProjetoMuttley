<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Patrocinador</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        h3 {
            font-size: 1.1rem;
            color: #007bff;
            margin: 1.5rem 0 1rem 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #4a4a4a;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .is-invalid {
            border-color: #dc3545 !important;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: block;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            transition: filter 0.2s;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
        }

        .btn-cancel {
            background-color: #e4e6eb;
            color: #4b4b4b;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 th:text="(${patrocinador.id != null} ? 'Editar Patrocinador' : 'Novo Patrocinador')"></h2>

        <form th:action="@{/patrocinador/salvar}" th:object="${patrocinador}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="tipo">Tipo de Patrocinador</label>
                <select th:field="*{tipo}" id="tipoSelect" onchange="toggleFields()">
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <!-- Dados PJ -->
            <div id="sectionPJ">
                <h3>Dados de Pessoa Jurídica</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Razão Social</label>
                        <input type="text" th:field="*{razaoSocial}">
                    </div>
                    <div class="form-group">
                        <label>Nome Fantasia</label>
                        <input type="text" th:field="*{nomeFantasia}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" th:field="*{cnpj}">
                    </div>
                    <div class="form-group">
                        <label>Inscrição Estadual</label>
                        <input type="text" th:field="*{inscricaoEstadual}">
                    </div>
                </div>
            </div>

            <!-- Dados PF -->
            <div id="sectionPF" class="hidden">
                <h3>Dados de Pessoa Física</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" th:field="*{nomeCompleto}">
                    </div>
                    <div class="form-group">
                        <label>CPF</label>
                        <input type="text" th:field="*{cpf}">
                    </div>
                </div>
            </div>

            <!-- Contato -->
            <h3>Dados de Contato</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" th:field="*{telefone}" th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                    <span th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-message"></span>
                </div>
            </div>
            <div class="form-group">
                <label>Nome do Responsável</label>
                <input type="text" th:field="*{nomeResponsavel}" th:classappend="${#fields.hasErrors('nomeResponsavel')} ? 'is-invalid'">
                <span th:if="${#fields.hasErrors('nomeResponsavel')}" th:errors="*{nomeResponsavel}" class="error-message"></span>
            </div>

            <!-- Localização -->
            <h3>Localização</h3>
            <div class="form-row" style="grid-template-columns: 3fr 1fr;">
                <div class="form-group">
                    <label>Logradouro</label>
                    <input type="text" th:field="*{logradouro}" th:classappend="${#fields.hasErrors('logradouro')} ? 'is-invalid'">
                </div>
                <div class="form-group">
                    <label>Número</label>
                    <input type="text" th:field="*{numero}" th:classappend="${#fields.hasErrors('numero')} ? 'is-invalid'">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Complemento</label>
                    <input type="text" th:field="*{complemento}">
                </div>
                <div class="form-group">
                    <label>Bairro</label>
                    <input type="text" th:field="*{bairro}" th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>CEP</label>
                    <input type="text" th:field="*{cep}" th:classappend="${#fields.hasErrors('cep')} ? 'is-invalid'">
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" th:field="*{cidade}" th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid'">
                </div>
                <div class="form-group">
                    <label>UF</label>
                    <input type="text" th:field="*{uf}" th:classappend="${#fields.hasErrors('uf')} ? 'is-invalid'">
                </div>
            </div>

            <!-- Social -->
            <h3>Redes Sociais</h3>
            <div class="form-group">
                <label>LinkedIn</label>
                <input type="text" th:field="*{linkedin}" placeholder="https://linkedin.com/in/usuario">
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-submit">Salvar</button>
                <a th:href="@{/patrocinador}" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        function toggleFields() {
            const tipo = document.getElementById('tipoSelect').value;
            const sectionPJ = document.getElementById('sectionPJ');
            const sectionPF = document.getElementById('sectionPF');

            if (tipo === 'PJ') {
                sectionPJ.classList.remove('hidden');
                sectionPF.classList.add('hidden');
            } else {
                sectionPJ.classList.add('hidden');
                sectionPF.classList.remove('hidden');
            }
        }
        // Run on load
        toggleFields();
    </script>
</body>

</html>
