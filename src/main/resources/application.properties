spring.application.name=Muttley
spring.datasource.url=jdbc:mysql://localhost:3306/medalha?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=alunofatec
 
spring.jpa.show-sql=false
spring.mvc.hiddenmethod.filter.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/
server.port=8080

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL base da aplicação (usada nos links do e-mail)
app.base-url=http://localhost:8080